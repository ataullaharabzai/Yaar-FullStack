<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/94f1987ab9.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <!-- Navbar head -->
      <div class="nav">
        <div class="logo">
            <p>Ghiza</p>
        </div>
        <div class="location">
          <p>DELIVER TO</p>
          <span>Home</span>
        </div>
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search restaurants and meals" />
        </div>
        <div class="choose-lang">
          <span>English</span>
          <p>Pashto</p>
        </div>
        <div class="notification">
          <i class="fa-regular fa-bell"></i>
        </div>
        <div class="view-card">
          <p>View cart</p>
          <span>0</span>
        </div>
        <div class="profile">
          <p>A</p>
        </div>
      </div>

      <!-- Navbar routing panel -->
      <div class="routing-panel">
        <ul>
          <li><a href="#">Browse</a></li>
          <li><a href="order.html">Orders</a></li>
          <li><a href="favorite.html">Favorites</a></li>
          <li><a href="wallet.html">Wallet</a></li>
        </ul>
      </div>
    </header>
  </body>
</html>
