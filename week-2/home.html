<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/94f1987ab9.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <!-- Navbar head -->
      <div class="nav">
        <div class="logo">
          <p>Ghiza</p>
        </div>
        <div class="location">
          <p>DELIVER TO</p>
          <span>Home</span>
        </div>
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Search restaurants and meals" />
        </div>
        <div class="choose-lang">
          <span>English</span>
          <p>Pashto</p>
        </div>
        <div class="notification">
          <i class="fa-regular fa-bell"></i>
        </div>
        <div class="view-card">
          <p>View cart</p>
          <span>0</span>
        </div>
        <div class="profile">
          <p>A</p>
        </div>
      </div>

      <!-- Navbar routing panel -->
      <div class="routing-panel">
        <ul>
          <li><a href="#">Browse</a></li>
          <li><a href="order.html">Orders</a></li>
          <li><a href="favorite.html">Favorites</a></li>
          <li><a href="wallet.html">Wallet</a></li>
        </ul>
      </div>
    </header>

    <!-- Discount label -->

    <main>
      <section>
        <div class="discount-label">
          <div class="discount-info">
            <div class="discount-badge">
              <!-- <span>.</span> -->
              <p>New here</p>
            </div>
            <div class="discount-title">
              <h2>20% off your first order</h2>
              <p>Up to AFN 200 off at any verified kitchen. Ends Sunday.</p>
            </div>
          </div>
          <div class="discount-label-right">
            <p>GHIZA20</p>
          </div>
        </div>
      </section>

      <!-- Filter badges -->
      <section>
        <div class="filter-box">
          <div class="filter-btn">All</div>
          <div class="filter-btn">Kabab</div>
          <div class="filter-btn">Palaw</div>
          <div class="filter-btn">Pizza</div>
          <div class="filter-btn">Burger</div>
          <div class="filter-btn">Bakery & tea</div>
          <div class="filter-btn">Sweets</div>
        </div>
      </section>
    </main>
  </body>
</html>
